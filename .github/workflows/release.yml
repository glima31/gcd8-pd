name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build release archive
        run: |
          git archive --format=zip --prefix="gcd8-${GITHUB_REF_NAME}/" \
            -o "gcd8-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "gcd8-${GITHUB_REF_NAME}.zip" \
            --verify-tag --draft --title "GCD-8 ${GITHUB_REF_NAME}"